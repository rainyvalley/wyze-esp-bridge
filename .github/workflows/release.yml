name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build all board variants
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyze-esp-bridge-binaries
          path: |
            out/*.bin

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wyze-esp-bridge-p4-merged.bin
            out/wyze-esp-bridge-p4-ota.bin
            out/wyze-esp-bridge-p4-rev1-merged.bin
            out/wyze-esp-bridge-p4-rev1-ota.bin
            out/wyze-esp-bridge-s3-eth-merged.bin
            out/wyze-esp-bridge-s3-eth-ota.bin
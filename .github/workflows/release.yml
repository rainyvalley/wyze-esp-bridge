name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  # Build pull requests too, so changes can be tested from the run's artifacts
  # before they reach main.
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job (tags only) can write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # release-v5.5, pinned by digest so release builds are reproducible. Bump deliberately.
      image: espressif/idf:release-v5.5@sha256:cb51f78629a9656e8823dd6f751d309968e88d3e2806d50bd99eac1ae6245f74
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build all board variants
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          ./build.sh
          (cd out && sha256sum *.bin > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wyze-esp-bridge-binaries
          path: |
            out/*.bin
            out/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wyze-esp-bridge-binaries
          path: out

      - name: Attach binaries to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/wyze-esp-bridge-p4-merged.bin
            out/wyze-esp-bridge-p4-ota.bin
            out/wyze-esp-bridge-p4-rev1-merged.bin
            out/wyze-esp-bridge-p4-rev1-ota.bin
            out/wyze-esp-bridge-s3-eth-merged.bin
            out/wyze-esp-bridge-s3-eth-ota.bin
            out/SHA256SUMS
